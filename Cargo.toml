[package]
name = "celox"
version = "0.1.0"
edition = "2024"
description = "Transaction load-testing tool for Celo chains"

[dependencies]
# Celo network support for alloy (CIP-64), from celo-kona PR #266.
# Pinned to the pushed tip of palango/cip64-client-request; switch to main after merge.
celo-alloy-network = { git = "https://github.com/celo-org/celo-kona", rev = "5bff854" }
celo-alloy-rpc-types = { git = "https://github.com/celo-org/celo-kona", rev = "5bff854" }
celo-alloy-consensus = { git = "https://github.com/celo-org/celo-kona", rev = "5bff854" }

# Alloy family pinned to celo-kona's workspace versions to avoid trait-bound skew.
alloy-provider = { version = "=2.0.5", features = ["reqwest"] }
alloy-signer-local = "=2.0.5"
alloy-primitives = "1.6.0"

tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = "0.3"
humantime = "2"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }
