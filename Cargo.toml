[package]
name = "celox"
version = "0.1.0"
edition = "2024"
description = "Transaction load-testing tool for Celo chains"

[dependencies]
# Celo network support for alloy (CIP-64), pinned to a celo-kona main commit.
# Later commits need celo-kona's op-alloy fork via [patch.crates-io].
celo-alloy-network = { git = "https://github.com/celo-org/celo-kona", rev = "82d6de6" }
celo-alloy-rpc-types = { git = "https://github.com/celo-org/celo-kona", rev = "82d6de6" }

# At least the alloy version celo-kona requires; Cargo resolves one version of
# each alloy crate, shared with celo-alloy.
alloy-contract = "2.3"
alloy-eips = "2.3"
alloy-provider = { version = "2.3", features = ["reqwest"] }
alloy-signer-local = "2.3"
alloy-primitives = "1.6.0"
alloy-sol-types = { version = "1.6.0", features = ["json"] }

tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures = "0.3"
humantime = "2"
libc = "0.2"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
alloy-transport = "2.3"
serde_json = "1"
tokio = { version = "1.49", features = ["test-util"] }
